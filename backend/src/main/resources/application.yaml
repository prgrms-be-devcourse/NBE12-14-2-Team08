server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  profiles:
    active: local

  output:
    ansi:
      enabled: always

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  invite-base-url: https://nbe-12-14-2-team08.vercel.app/


jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-key-1234567890}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}

supabase:
  url: "https://akddfxudxdicwjpaword.supabase.co"
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    habit-bucket: "habit-verifications"
    penalty-bucket: "penalty-verifications"
    url-expiration-seconds: 300