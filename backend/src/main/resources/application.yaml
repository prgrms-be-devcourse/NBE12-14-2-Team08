server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  profiles:
    active: local

  output:
    ansi:
      enabled: always

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  invite-base-url: ${INVITE_BASE_URL:http://localhost:3000/invite/}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
    com.back: DEBUG


jwt:
  secret: ${JWT_SECRET:local-development-jwt-secret-key-1234567890}
  access-expiration: ${JWT_ACCESS_EXPIRATION:1800000}

supabase:
  url: "https://akddfxudxdicwjpaword.supabase.co"
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  storage:
    habit-bucket: "habit-verifications"
    penalty-bucket: "penalty-verifications"
    # 업로드 Signed URL 발급 요청에 함께 보내지만, Supabase는 업로드용 URL에 이 값을 적용하지 않는다.
    url-expiration-seconds: 300
